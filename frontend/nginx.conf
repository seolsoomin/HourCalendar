server {
    listen 80;
    server_name hourcalendar.kr www.hourcalendar.kr;
    return 301 https://hourcalendar.kr$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.hourcalendar.kr;

    ssl_certificate     /etc/letsencrypt/live/hourcalendar.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hourcalendar.kr/privkey.pem;

    return 301 https://hourcalendar.kr$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hourcalendar.kr;

    ssl_certificate     /etc/letsencrypt/live/hourcalendar.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hourcalendar.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;

    client_max_body_size 6m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
