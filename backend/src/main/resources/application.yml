spring:
  application:
    name: hour
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:mariadb://localhost:3307/hour?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: root
    driver-class-name: org.mariadb.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

hour:
  allowed-origins: http://localhost:3000
  upload-dir: uploads
  upload-cleanup:
    keep-days: 7
    cron: "0 30 4 * * *"

server:
  port: 8080
  servlet:
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
        max-age: 7d

logging:
  level:
    com.hour: debug
